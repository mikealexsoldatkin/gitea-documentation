name: Publish task description

on:
  pull_request:

jobs:
  publish-task:
    runs-on: ubuntu-latest
    container:
      image: mikealexsoldatkin/node18-git-lfs:1.0.2
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci
        working-directory: scripts

      - name: Prepare specification
        run: |
          git fetch origin master
          git merge-base origin/master HEAD
          mkdir -p "temp/crm-specification"
          git archive origin/master docs tasks | tar -x -C "temp/crm-specification"

      - run: node scripts/index.js --no-deprecation TASK_PUBLISHING_MODE